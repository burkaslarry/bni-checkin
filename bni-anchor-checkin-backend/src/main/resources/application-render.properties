# Render PostgreSQL - use with: --spring.profiles.active=render
# Set DATABASE_* or Spring-standard SPRING_DATASOURCE_* env vars. Defaults avoid unresolved-placeholder crashes when scanning @ConditionalOnProperty beans.
# No production credentials committed here.

# Non-empty fallback keeps PostgreSQL driver + URL aligned; empty URL would activate embedded H2 and break this profile.
spring.datasource.url=${DATABASE_JDBC_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:65432/_configure_DATABASE_JDBC_URL?connectTimeout=2}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:bni_configure_db_user}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:bni_configure_db_password}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

captcha.secret=${CAPTCHA_SECRET:}

