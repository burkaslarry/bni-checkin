# Supabase PostgreSQL - use with: --spring.profiles.active=supabase
# Set these values from your deployment or local shell environment.

spring.datasource.url=${SUPABASE_DATABASE_JDBC_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:65432/_configure_SUPABASE_DATABASE_JDBC_URL?connectTimeout=2}}
spring.datasource.username=${SUPABASE_DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:bni_configure_db_user}}
spring.datasource.password=${SUPABASE_DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:bni_configure_db_password}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3500
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
