# Deploy backend to Render: connect this repo and use Blueprint (render.yaml)
# Set env vars in Render Dashboard: DATABASE_JDBC_URL (or SPRING_DATASOURCE_*), DATABASE_USERNAME, DATABASE_PASSWORD
# Production Postgres: Render Postgres only (not Supabase). Apply SQL migrations via `render psql <postgres-id> --confirm -c "..."`.
services:
  - type: web
    name: bni-anchor-checkin-backend
    env: docker
    rootDir: bni-anchor-checkin-backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/members
    envVars:
      - key: JAVA_OPTS
        value: -Xmx256m -Xms128m
