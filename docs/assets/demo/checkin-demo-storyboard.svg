<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">EventXP check-in demo storyboard</title>
  <desc id="desc">Storyboard for recording a short demo GIF of the EventXP check-in workflow.</desc>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="80" y="95" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">Demo GIF Storyboard</text>
  <text x="80" y="132" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Use this sequence when recording docs/assets/demo/checkin-demo.gif</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="190" width="250" height="320" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="110" y="245" font-size="22" font-weight="700" fill="#1d4ed8">1. Open check-in</text>
    <text x="110" y="286" font-size="16" fill="#475569">Navigate to /</text>
    <text x="110" y="314" font-size="16" fill="#475569">Choose member or guest</text>
    <rect x="110" y="370" width="190" height="64" rx="14" fill="#2563eb"/>
    <text x="158" y="410" font-size="18" font-weight="700" fill="#ffffff">Start</text>
    <rect x="390" y="190" width="250" height="320" rx="20" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="420" y="245" font-size="22" font-weight="700" fill="#15803d">2. Submit form</text>
    <text x="420" y="286" font-size="16" fill="#475569">Scan QR or enter details</text>
    <text x="420" y="314" font-size="16" fill="#475569">Show success message</text>
    <rect x="420" y="370" width="190" height="64" rx="14" fill="#16a34a"/>
    <text x="466" y="410" font-size="18" font-weight="700" fill="#ffffff">Check in</text>
    <rect x="700" y="190" width="250" height="320" rx="20" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <text x="730" y="245" font-size="22" font-weight="700" fill="#b45309">3. Review admin</text>
    <text x="730" y="286" font-size="16" fill="#475569">Navigate to /admin</text>
    <text x="730" y="314" font-size="16" fill="#475569">Open reports/records</text>
    <rect x="730" y="370" width="190" height="64" rx="14" fill="#f59e0b"/>
    <text x="780" y="410" font-size="18" font-weight="700" fill="#ffffff">Report</text>
    <rect x="1010" y="190" width="190" height="320" rx="20" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <text x="1040" y="245" font-size="22" font-weight="700" fill="#6d28d9">4. Export</text>
    <text x="1040" y="286" font-size="16" fill="#475569">Download CSV</text>
    <text x="1040" y="314" font-size="16" fill="#475569">End on summary</text>
    <rect x="1040" y="370" width="130" height="64" rx="14" fill="#7c3aed"/>
    <text x="1079" y="410" font-size="18" font-weight="700" fill="#ffffff">CSV</text>
  </g>
  <text x="80" y="610" font-family="Arial, sans-serif" font-size="18" fill="#475569">Recommended final asset: 8-12 seconds, 1280x720, saved as docs/assets/demo/checkin-demo.gif.</text>
</svg>
