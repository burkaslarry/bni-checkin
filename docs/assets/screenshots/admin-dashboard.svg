<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">EventXP admin dashboard screenshot placeholder</title>
  <desc id="desc">Illustrative screenshot showing the EventXP admin dashboard with event, import, report, and QR tools.</desc>
