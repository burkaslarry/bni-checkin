server.port=${PORT:10000}

# DeepSeek AI API Configuration
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=https://api.deepseek.com/v1/chat/completions

# Resend — post-event attendance CSV email (set RESEND_API_KEY in env; never commit the key)
resend.api.key=${RESEND_API_KEY:}
resend.api.url=${RESEND_API_URL:https://api.resend.com/emails}
attendance.email.enabled=${ATTENDANCE_EMAIL_ENABLED:true}
attendance.email.from=${ATTENDANCE_EMAIL_FROM:EventXP <info@innovatexp.co>}
attendance.email.to=${ATTENDANCE_EMAIL_TO:lo.wailun5@gmail.com}
attendance.email.poll-ms=${ATTENDANCE_EMAIL_POLL_MS:300000}
attendance.email.grace-minutes=${ATTENDANCE_EMAIL_GRACE_MINUTES:5}

# Database: use profile 'supabase' for Supabase, 'render' for Render Postgres (see application-supabase.properties / application-render.properties)
# Set production database values through environment variables, not committed config.
# Local PostgreSQL for testing (run init-database.sql first; use run.sh, not run_prod.sh)
spring.datasource.url=${LOCAL_DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/bni_checkin}
spring.datasource.username=${LOCAL_DB_USER:${USER:larrylo}}
spring.datasource.password=${LOCAL_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

