  <rect x="934" y="210" width="230" height="150" rx="18" fill="#ede9fe"/>
  <text x="964" y="270" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#6d28d9">Reports</text>
  <text x="964" y="306" font-family="Arial, sans-serif" font-size="16" fill="#475569">Export attendance CSV</text>
  <rect x="112" y="420" width="1052" height="148" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="146" y="470" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#334155">Live event summary</text>
